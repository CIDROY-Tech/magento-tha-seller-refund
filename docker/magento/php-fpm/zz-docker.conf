; PHP-FPM pool for the web image.
;
; php-fpm and nginx share one container (supervisord runs both), so the pool
; listens on a loopback TCP socket that the nginx `fastcgi_backend` upstream
; points at. The base php:8.3-fpm image ships a zz-docker.conf that switches
; the pool to listen on 9000; this file overrides it to bind loopback only and
; keeps the master process in the foreground for supervisord.

[global]
daemonize = no

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
clear_env = no
