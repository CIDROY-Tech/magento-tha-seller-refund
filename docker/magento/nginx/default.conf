# nginx site config for the pre-baked Magento web image.
#
# nginx and php-fpm run side by side in one container (see supervisord.conf),
# so requests are forwarded to php-fpm over loopback. The bulk of the Magento
# routing (static.php fallback, media handler, the phpfpm entry points) comes
# from nginx.conf.sample, shipped by magento2-base and generated with the
# store's own settings. We only add the pieces that must sit in front of it.

upstream fastcgi_backend {
    server 127.0.0.1:9000;
}

server {
    listen 8080;
    server_name localhost;

    set $MAGE_ROOT /var/www/html;
    set $MAGE_MODE developer;

    # Health endpoint used by the container healthcheck and the readiness
    # gate. It is a plain PHP script in pub/ with no Magento bootstrap. This
    # exact-match location is declared BEFORE the include so the sample's
    # generic "deny direct .php execution" rule cannot shadow it.
    location = /assignment-health.php {
        root $MAGE_ROOT/pub;
        fastcgi_pass fastcgi_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 30s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        include fastcgi_params;
    }

    include /var/www/html/nginx.conf.sample;
}
