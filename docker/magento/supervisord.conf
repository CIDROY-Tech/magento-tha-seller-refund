; supervisord runs the three long-lived processes of the web container:
; php-fpm, nginx, and a minute cron loop. It stays in the foreground as the
; container's CMD; the entrypoint execs it after the stack is ready.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron-loop]
; Magento cron schedules jobs on one pass and executes them on the next, so a
; job can take up to two minutes to run. The Admin save path dispatches the
; ERP create opportunistically after commit, so operators never wait on cron;
; this loop drives the outbox consumers and the reconciler in the background.
;
; Runs as www-data so the log file it opens is www-data-owned - otherwise a
; root-created assignment-cron.log blocks setup:install's write-permission check
; during the bake. (No gosu needed; supervisord drops to www-data.)
user=www-data
command=/bin/bash -c "while true; do php /var/www/html/bin/magento cron:run >> /var/www/html/var/log/assignment-cron.log 2>&1; sleep 60; done"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
