; PHP settings for the pre-baked Magento web image.
; Tuned for Magento Open Source 2.4.7 running in developer mode inside a
; container. Values follow the platform's documented requirements.

memory_limit = 2G
max_execution_time = 1800
max_input_time = 1800
max_input_vars = 10000
post_max_size = 64M
upload_max_filesize = 64M
realpath_cache_size = 10M
realpath_cache_ttl = 86400
date.timezone = Asia/Tokyo
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
zlib.output_compression = On
session.gc_maxlifetime = 86400

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 100000
opcache.save_comments = 1
; Developer mode: pick up PHP source edits from the bind-mounted module
; without a container restart.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
